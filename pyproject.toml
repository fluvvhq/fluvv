[build-system]
# 77 is the first setuptools to take `license` as an SPDX expression (PEP 639).
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fluvv"
version = "1.0.0.dev0"
description = "Fluvv data contracts: an ODCS v3.1.0 extension that describes a table and how it's built, with lint, compile and export."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "The Fluvv Authors" }]
keywords = ["data contracts", "odcs", "odps", "data governance", "data lineage", "medallion"]
# Only versions the tests run on are listed.
classifiers = [
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Software Development :: Quality Assurance",
]
# datacontract-cli needs Python >=3.10. Developed against 3.13.
requires-python = ">=3.10"
dependencies = [
    # Contract tooling: lint/export/test
    # against ODCS contracts. Scoped to local-file backends only (dataframe:
    # ibis/pandas/pyarrow, duckdb: local test engine, csv/parquet: local file
    # formats). We tried datacontract-cli[all] first, which pulls in every
    # cloud SDK (databricks, azure, snowflake, kafka, iceberg, ...)
    # simultaneously -- pip's resolver hit "resolution-too-deep" on that
    # combined graph. Add specific cloud extras later, one at a time, only
    # when a cloud backend is actually needed: fluvv is local-first.
    # Below the next minor: fluvv reads the ODCS schemas datacontract-cli
    # ships and depends on its lint and test results, so a new minor gets
    # tested before it's allowed.
    "datacontract-cli[dataframe,duckdb,csv,parquet]>=1.1.1,<1.2",
    # Already present transitively via datacontract-cli, but fluvv imports
    # them directly, so they're declared here rather than relied on
    # implicitly. Ranges, not pins: an installed library shares its
    # environment with others. Each lower bound is the oldest version the
    # tests pass with (CI's lowest-versions job).
    "pyyaml>=6.0.1,<7",
    "jsonschema>=4.23,<5",
    # 28 is the first to name a query's CTE list `with_`, which
    # fluvv.lineage sets when it composes per-source transforms.
    "sqlglot>=28,<31",
    "typer>=0.18,<1",
    "pydantic>=2.8.2,<3",
]

[project.optional-dependencies]
# For working on fluvv itself: `pip install -e .[dev]`, then `pytest`.
dev = ["pytest>=8,<10"]

[project.urls]
Homepage = "https://fluvv.se"
Documentation = "https://fluvv.se/docs"
Source = "https://github.com/fluvvhq/fluvv"
Issues = "https://github.com/fluvvhq/fluvv/issues"

[project.scripts]
fluvv = "fluvv.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fluvv = ["schemas/*.json"]
