name: Release

# Pushing a tag like v1.0.0 publishes that version: to TestPyPI first,
# then installed from there and run on the example, and only then to
# PyPI. Both indexes trust this workflow (trusted publishing), so no
# token is stored anywhere.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Check the tag matches the package version
        run: |
          version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME doesn't match version $version in pyproject.toml" >&2
            exit 1
          fi
      - name: Build
        run: |
          pip install build twine
          python -m build
          twine check --strict dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  testpypi:
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  verify:
    needs: testpypi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install from TestPyPI and run it on the example
        run: |
          version=${GITHUB_REF_NAME#v}
          # Only fluvv itself comes from TestPyPI, where anyone can upload;
          # its dependencies resolve from PyPI. A new upload takes a moment
          # to be served.
          for attempt in 1 2 3 4 5 6; do
            pip download --no-deps --index-url https://test.pypi.org/simple/ -d testpypi "fluvv==$version" && break
            sleep 20
          done
          pip install testpypi/fluvv-*.whl
          test "$(fluvv --version)" = "fluvv $version"
          cd tests/fixtures/sales
          fluvv lint
          fluvv compile

  pypi:
    needs: verify
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
